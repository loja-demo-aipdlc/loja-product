# Check "aipdlc" do perfil Base (etapa 3): avalia o PR e publica o resultado como check, que o ruleset exige.
# O motor é baixado de um repositório privado com um token só de leitura (segredo AIPDLC_ENGINE_TOKEN).
# Nunca faz checkout nem executa código do PR: lê o PR, as reviews e as políticas pela API.
# Antes de usar fora da demo, fixe cada action pelo SHA completo do commit.
name: aipdlc

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: aipdlc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # O job NÃO se chama aipdlc: o check exigido pelo ruleset é o que o motor publica. Com o mesmo nome, o job (que
  # termina com sucesso mesmo quando o motor publica "Bloqueado") satisfaria o ruleset no lugar do check.
  motor:
    name: motor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Motor dos checks (somente leitura)
        uses: actions/checkout@v4
        with:
          repository: gabrielmissio/ai-pdlc
          ref: main
          token: ${{ secrets.AIPDLC_ENGINE_TOKEN }}
          path: engine
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências fixadas
        run: pip install -q -r engine/requirements.txt

      - name: Avaliar o PR e publicar o check
        working-directory: engine/examples/loja-demo/repos/aipdlc-checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m aipdlc check-run --repo "$REPO" --numero "$PR" --sha "$SHA"
